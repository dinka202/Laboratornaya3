<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Анимация Точек (Hover)</title>
        <link rel="stylesheet" href="stil1.css">
    </head>
    <body>
        <div class="animation-container">
            <div class="dot-sequence">
                <div class="dot" style="--dot-index: 0;"></div>
                <div class="dot" style="--dot-index: 1;"></div>
                <div class="dot" style="--dot-index: 2;"></div>
                <div class="dot" style="--dot-index: 3;"></div>
                <div class="dot" style="--dot-index: 4;"></div>
                <div class="dot" style="--dot-index: 5;"></div>
            </div>
        </div>
    </body>
</html>
